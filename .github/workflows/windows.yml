name: Windows x64
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CC: gcc
    steps:
      - uses: actions/checkout@v7
        with:
          path: luce-http-server
      - name: Read dependency pins
        id: pins
        shell: pwsh
        run: |
          "base=$(Get-Content luce-http-server/bootstrap/BASE)" >> $env:GITHUB_OUTPUT
          "luce=$(Get-Content luce-http-server/bootstrap/LUCE)" >> $env:GITHUB_OUTPUT
          "server=$(Get-Content luce-http-server/bootstrap/SERVER)" >> $env:GITHUB_OUTPUT
          "json=$(Get-Content luce-http-server/bootstrap/JSON)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-base
          ref: ${{ steps.pins.outputs.base }}
          path: luce-base
      - name: Check out the pinned library packages
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          while read -r name revision; do
            [ -n "$name" ] || continue
            git init -q "$name"
            git -C "$name" fetch -q --depth 1 "https://github.com/dymokomi/$name.git" "$revision"
            git -C "$name" checkout -q --detach FETCH_HEAD
          done < luce-http-server/bootstrap/PACKAGES
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce
          ref: ${{ steps.pins.outputs.luce }}
          path: luce
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-server
          ref: ${{ steps.pins.outputs.server }}
          path: luce-server
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-json
          ref: ${{ steps.pins.outputs.json }}
          path: luce-json
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-vulkan-devel
      - name: Build Base
        working-directory: luce-base
        shell: msys2 {0}
        run: python tools/build_windows.py
      - name: Build Luce
        working-directory: luce
        shell: msys2 {0}
        run: python tools/build_windows.py
      - name: Run Windows contracts
        working-directory: luce-http-server
        shell: msys2 {0}
        run: python tests/run.py
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: luce-http-server-windows-${{ github.sha }}
          path: |
            luce-http-server/build/*.log
            luce-http-server/build/*results.json
